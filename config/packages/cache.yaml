framework:
    cache:
        prefix_seed: diabcare/diabcare_api

        # Pool applicatif pour les données de catalogue (aliments, insulines,
        # etc.) quasi-statiques, lues par de nombreux utilisateurs.
        # Par défaut : système de fichiers. Pour monter en charge sur Redis,
        # décommenter et répartir les pools sur un provider partagé :
        #
        #   app: cache.adapter.redis
        #   default_redis_provider: '%env(resolve:REDIS_DSN)%'
        #
        # (ex: REDIS_DSN=redis://127.0.0.1:6379)
        pools:
            api.catalog:
                adapter: cache.adapter.filesystem
                # TTL par défaut des entrées du catalogue (300 s).
                default_lifetime: 300