lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    user_id_claim: email
    # Une session de travail peut durer toute une journée. Sans refresh-token
    # configuré, la durée par défaut (1 h) déconnectait un utilisateur actif.
    token_ttl: 28800
